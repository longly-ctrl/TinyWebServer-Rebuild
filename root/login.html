<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>

    <form action="/login" method="post">
        <p>
            <label>Username:</label>
            <input type="text" name="username">
        </p>

        <p>
            <label>Password:</label>
            <input type="password" name="password">
        </p>

        <button type="submit">Login</button>
    </form>

    <p>
        <a href="/index.html">Back</a>
    </p>
</body>
</html>
