<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TinyWebServer</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <a class="brand" href="/index.html">
                <span class="brand-mark">T</span>
                <span>TinyWebServer</span>
            </a>

            <nav class="nav-links" aria-label="Primary navigation">
                <a class="nav-link" href="/index.html">Home</a>
                <a class="nav-link" href="/login.html">Login</a>
            </nav>
        </header>

        <main class="main-area auth-layout">
            <section class="panel auth-card" aria-labelledby="register-title">
                <p class="eyebrow">New account</p>
                <h1 id="register-title">Register</h1>
                <p class="auth-copy">Create a user record that can be verified through the login form.</p>

                <form class="form-stack" action="/register" method="post">
                    <div class="field">
                        <label for="username">Username</label>
                        <input id="username" type="text" name="username" autocomplete="username" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" type="password" name="password" autocomplete="new-password" required>
                    </div>

                    <div class="form-actions">
                        <button class="button button-primary" type="submit">Create account</button>
                        <a class="secondary-link" href="/index.html">Back to home</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
